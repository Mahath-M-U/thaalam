[project]
name = "thaalam"
version = "0.1.0"
description = "Local WHOOP health dashboard — FastAPI backend + React frontend over DuckDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=25.1.0",
    "bleak>=3.0.2",
    "duckdb>=1.5.4",
    "email-validator>=2.3.0",
    "fastapi>=0.139.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.1.1",
]
