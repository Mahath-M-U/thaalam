[project]
name = "thaalam"
version = "0.1.0"
description = "Local WHOOP health dashboard — FastAPI backend + React frontend over DuckDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=25.1.0",
    "bleak>=3.0.2",
    "duckdb>=1.5.4",
    "email-validator>=2.3.0",
    "fastapi>=0.139.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Without this, `pip install .` fails outright: setuptools' flat-layout
# discovery sees the `thaalam` package next to main.py, run_api.py and
# generate_report.py and refuses to guess. Local `uv run` never noticed,
# because it imports the package from the working directory rather than
# installing it -- but the container image installs, so it could not build.
[tool.setuptools.packages.find]
include = ["thaalam*"]

# The root scripts are entrypoints copied in beside the package, not modules
# to ship inside the distribution.
[tool.setuptools]
py-modules = []
